<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novela Gráfica</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tipografía -->
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+French+Canon+Pro&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'ubuntu': ['Ubuntu', 'sans-serif'],
            'fell': ['"IM Fell French Canon Pro"', 'serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 font-ubuntu">

  <!-- Título principal -->
  <header class="text-center mt-8 mb-8">
    <h1 class="font-fell text-5xl text-gray-900 mb-2">Trópico de Cáncer</h1>
    <h2 class="font-ubuntu text-2xl text-gray-700">Henry Miller</h2>
  </header>

  <!-- Galería de miniaturas -->
  <div id="galeria" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 max-w-6xl mx-auto p-4">
    <img src="img/comic/page_1.jpg" alt="Página 1" class="cursor-pointer rounded shadow-md hover:scale-150 transition-transform" onclick="abrirPagina(0)">
    <img src="img/comic/page2.jpg" alt="Página 2" class="cursor-pointer rounded shadow-md hover:scale-105 transition-transform" onclick="abrirPagina(1)">
    <img src="img/comic/page3.jpg" alt="Página 3" class="cursor-pointer rounded shadow-md hover:scale-105 transition-transform" onclick="abrirPagina(2)">
    <img src="img/comic/page_4.jpg" alt="Página 4" class="cursor-pointer rounded shadow-md hover:scale-105 transition-transform" onclick="abrirPagina(3)">
    <img src="img/comic/page_5.webp" alt="Página 5" class="cursor-pointer rounded shadow-md hover:scale-105 transition-transform" onclick="abrirPagina(4)">
    <img src="img/comic/page6.webp" alt="Página 6" class="cursor-pointer rounded shadow-md hover:scale-105 transition-transform" onclick="abrirPagina(5)">
    <img src="img/comic/page7.webp" alt="Página 7" class="cursor-pointer rounded shadow-md hover:scale-105 transition-transform" onclick="abrirPagina(6)">
    <img src="img/comic/page8.webp" alt="Página 8" class="cursor-pointer rounded shadow-md hover:scale-105 transition-transform" onclick="abrirPagina(7)">
    <img src="img/comic/page9.jpeg" alt="Página 9" class="cursor-pointer rounded shadow-md hover:scale-105 transition-transform" onclick="abrirPagina(8)">
    <img src="img/comic/page10.jpg" alt="Página 10" class="cursor-pointer rounded shadow-md hover:scale-105 transition-transform" onclick="abrirPagina(9)">
    <img src="img/comic/page11.jpg" alt="Página 11" class="cursor-pointer rounded shadow-md hover:scale-105 transition-transform" onclick="abrirPagina(10)">
    <img src="img/comic/page12.webp" alt="Página 12" class="cursor-pointer rounded shadow-md hover:scale-105 transition-transform" onclick="abrirPagina(11)">
    <img src="img/comic/page13.webp" alt="Página 13" class="cursor-pointer rounded shadow-md hover:scale-105 transition-transform" onclick="abrirPagina(12)">
  </div>

  <!-- Overlay página grande -->
  <div id="vistaGrande" class="fixed inset-0 bg-black bg-opacity-80 hidden flex justify-center items-center z-50">
    <img id="imagenGrande" src="" alt="Página grande" class="max-w-[95%] max-h-[95%] rounded-lg shadow-2xl transition-transform transform hover:scale-150">
    
    <!-- Botón cerrar -->
    <button class="absolute top-4 right-4 bg-white bg-opacity-30 hover:bg-opacity-60 text-white text-2xl rounded px-3 py-1" onclick="cerrarPagina()">×</button>
    
    <!-- Botón anterior -->
    <button class="absolute left-4 top-1/2 transform -translate-y-1/2 bg-white bg-opacity-30 hover:bg-opacity-60 text-white text-3xl rounded-full px-4 py-2" onclick="anterior()">‹</button>
    
    <!-- Botón siguiente -->
    <button class="absolute right-4 top-1/2 transform -translate-y-1/2 bg-white bg-opacity-30 hover:bg-opacity-60 text-white text-3xl rounded-full px-4 py-2" onclick="siguiente()">›</button>
  </div>

  <script>
    const paginas = [
      "img/comic/page_1.jpg",
      "img/comic/page2.jpg",
      "img/comic/page3.jpg",
      "img/comic/page_4.jpg",
      "img/comic/page_5.webp",
      "img/comic/page6.webp",
      "img/comic/page7.webp",
      "img/comic/page8.webp",
      "img/comic/page9.jpeg",
      "img/comic/page10.jpg",
      "img/comic/page11.jpg",
      "img/comic/page12.webp",
      "img/comic/page13.webp"
    ];

    let indice = 0;
    const vista = document.getElementById("vistaGrande");
    const imagen = document.getElementById("imagenGrande");

    function abrirPagina(i){
      indice = i;
      imagen.src = paginas[indice];
      vista.classList.remove("hidden");
    }

    function cerrarPagina(){
      vista.classList.add("hidden");
    }

    function siguiente(){
      indice = (indice + 1) % paginas.length;
      imagen.src = paginas[indice];
    }

    function anterior(){
      indice = (indice - 1 + paginas.length) % paginas.length;
      imagen.src = paginas[indice];
    }
  </script>

</body>
</html>
