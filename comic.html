<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>French Revolution Comic</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fuente elegante -->
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+French+Canon+Pro&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <!-- Estilos generales -->
  <link rel="stylesheet" href="css/estilo.css" />

  <!-- Fuente decorativa original -->
  <style>
    @font-face {
      font-family: 'Sucrose Bold Two';
      src: url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/4273/sucrose.woff2') format('woff2');
    }
  </style>
</head>

<body class="page-french bg-[#1a0b0b] text-gray-200 font-[IM_Fell_French_Canon_Pro] min-h-screen flex flex-col">

  <!-- Encabezado -->
  <header class="relative bg-cover bg-center text-center py-24 px-6" style="background-image: url('img/frenchrevolution4.jpg');">
    <div class="bg-black/50 absolute inset-0"></div>
    <div class="relative z-10">
      <h1 class="text-6xl md:text-8xl leading-tight font-[Playfair_Display] text-[#f0e6e6] drop-shadow-xl">
        Revolución Francesa Comic
      </h1>
      <h2 class="text-2xl md:text-3xl mt-6 text-[#d1bebe] italic">
        por Giselle Ciardullo
      </h2>
    </div>
  </header>

  <!-- Galería -->
  <main class="flex-grow max-w-6xl mx-auto p-8 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-6">
    <template id="imagen-template">
      <img class="cursor-pointer rounded-lg shadow-md hover:scale-125 transition-transform duration-300" />
    </template>
  </main>

  <!-- Overlay para ver imagen grande -->
  <div id="overlay" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
    <img id="imagen-grande" class="max-h-[90vh] max-w-[90vw] rounded-lg shadow-2xl transition-transform duration-500 scale-100" />
    <button id="cerrar" class="absolute top-6 right-8 text-white text-4xl hover:scale-125 transition-transform">×</button>
  </div>

  <!-- Botón de volver -->
  <div class="flex justify-center mt-10">
    <a href="index.html"
       class="bg-[#4c0e0e] text-white text-lg px-6 py-3 rounded-full shadow-md hover:bg-[#6b1a1a] hover:scale-105 transform transition-all duration-300 font-semibold tracking-wide">
      ← Volver a la portada
    </a>
  </div>

  <!-- Footer -->
  <footer class="text-center py-6 text-[#bfa9a9] text-sm border-t border-[#4c0e0e]">
    <p>&copy; 2023 Giselle Ciardullo. Todos los derechos reservados.</p>
  </footer>

  <!-- Script externo -->
  <script src="js/comic.js"></script>
</body>
</html>
