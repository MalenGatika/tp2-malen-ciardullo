  </div>

    <button id="cerrar" class="absolute top-6 right-8 text-white text-4xl hover:scale-125 transition-transform">×</button>

    <button id="anterior" class="absolute left-4 top-1/2 transform -translate-y-1/2 text-white text-3xl hover:scale-125 transition-transform">‹</button>
