<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novela Gráfica - Trópico de Cáncer</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+French+Canon+Pro&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="bg-bordo-oscuro font-ubuntu text-blanco-suave">

  <header class="text-center mt-8 mb-8">

    
    <h1 class="font-fell text-5xl text-bordo-claro mb-2">Trópico de Cáncer</h1>
    <h2 class="font-ubuntu text-2xl text-beige">Henry Miller</h2>
  </header>

  <!-- Galería de miniaturas -->
  <div id="galeria" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 max-w-6xl mx-auto p-4">
    <img src="img/comic/page_1.jpg" alt="Página 1" class="miniatura" onclick="abrirPagina(0)">
    <img src="img/comic/page2.jpg" alt="Página 2" class="miniatura" onclick="abrirPagina(1)">
    <img src="img/comic/page3.jpg" alt="Página 3" class="miniatura" onclick="abrirPagina(2)">
    <img src="img/comic/page_4.jpg" alt="Página 4" class="miniatura" onclick="abrirPagina(3)">
    <img src="img/comic/page_5.webp" alt="Página 5" class="miniatura" onclick="abrirPagina(4)">
    <img src="img/comic/page6.webp" alt="Página 6" class="miniatura" onclick="abrirPagina(5)">
    <img src="img/comic/page7.webp" alt="Página 7" class="miniatura" onclick="abrirPagina(6)">
    <img src="img/comic/page8.webp" alt="Página 8" class="miniatura" onclick="abrirPagina(7)">
    <img src="img/comic/page9.jpeg" alt="Página 9" class="miniatura" onclick="abrirPagina(8)">
    <img src="img/comic/page10.jpg" alt="Página 10" class="miniatura" onclick="abrirPagina(9)">
    <img src="img/comic/page11.jpg" alt="Página 11" class="miniatura" onclick="abrirPagina(10)">
    <img src="img/comic/page12.webp" alt="Página 12" class="miniatura" onclick="abrirPagina(11)">
    <img src="img/comic/page13.webp" alt="Página 13" class="miniatura" onclick="abrirPagina(12)">
  </div>

<div id="vistaGrande" class="fixed inset-0 bg-black/90 hidden flex justify-center items-center z-50">
  <div class="zoom-container">
    <img id="imagenGrande" src="" alt="Página grande" class="imagen-grande">
  </div>
    
    <!-- Botón cerrar -->
    <button id="cerrar" class="absolute top-6 right-8 text-white text-4xl hover:scale-125 transition-transform">×</button>
    
    <!-- Botón anterior -->
    <button id="anterior" class="absolute left-4 top-1/2 transform -translate-y-1/2 text-white text-3xl hover:scale-125 transition-transform">‹</button>
    
    <!-- Botón siguiente -->
    <button id="siguiente" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-white text-3xl hover:scale-125 transition-transform">›</button>
  </div>
<!-- Botón de volver a la portada -->
<div class="flex justify-center mt-8">
  <a href="index.html"
     class="bg-bordo-claro text-blanco-suave text-lg px-6 py-3 rounded-full shadow-md hover:bg-bordo-medio hover:scale-105 transform transition-all duration-300 font-semibold tracking-wide">
    ← Volver a la portada
  </a>
</div>


  <script src="js/menu.js"></script>

  <script src="js/novela-grafica.js"></script>
</body>
</html>
