<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giselle Ciardullo</title>
  
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fuente tipo escrita a mano -->
  <link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&family=Ubuntu:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Ubuntu', sans-serif;
    }
    h1 {
      font-family: 'Homemade Apple', cursive;
    }
  </style>
</head>

<body class="relative min-h-screen bg-black text-white overflow-hidden">

  <!-- 🌊 Video de fondo -->
  <div class="absolute inset-0 -z-10">
    <video id="bgVideo" autoplay muted loop playsinline class="w-full h-full object-cover">
      <source src="img/mariposas.mp4" type="video/mp4" />
    </video>
    <!-- Overlay -->
    <div class="absolute inset-0 bg-black/60"></div>
  </div>

  <!-- 🔊 Botón de sonido -->
  <button id="btnAudio" 
    class="absolute bottom-6 right-6 bg-white/80 text-black px-4 py-2 rounded-lg shadow-md hover:bg-white transition z-20">
    🔊 Activar sonido
  </button>

  <!-- 🖋️ Encabezado -->
  <header class="flex flex-col justify-center items-center h-screen text-center px-6">
    <h1 class="text-6xl md:text-8xl mb-4 drop-shadow-lg">Giselle Ciardullo</h1>
    <h2 class="text-2xl md:text-3xl font-light tracking-wider drop-shadow-md">Artes Plásticas</h2>
  </header>

  <!-- 📜 Navegación -->
  <nav class="fixed top-0 left-0 w-full bg-black/40 backdrop-blur-sm shadow-md py-4 z-30">
    <ul class="flex justify-center gap-10 text-xl font-semibold text-white">
      <li><a href="sketch.html" target="_blank" class="hover:text-pink-300 transition">Sketchbooks</a></li>
      <li><a href="novela.html" target="_blank" class="hover:text-pink-300 transition">Novela Gráfica</a></li>
      <li><a href="comic.html" target="_blank" class="hover:text-pink-300 transition">Comic</a></li>
    </ul>
  </nav>

  <!-- 🎶 Script externo -->
  <script src="js/audioControl.js"></script>
</body>
</html>
