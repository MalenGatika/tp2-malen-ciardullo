<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giselle Ciardullo</title>
  
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fuente tipo escrita a mano -->
  <link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&family=Ubuntu:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Ubuntu', sans-serif;
    }
    h1 {
      font-family: 'Homemade Apple', cursive;
    }
  </style>
</head>

<body class="relative min-h-screen bg-black text-white overflow-hidden">

<div class="absolute inset-0 -z-10 overflow-hidden">
  
  <!-- Video -->
  <video id="bgVideo" autoplay muted loop playsinline class="w-full h-full object-cover">
    <source src="img/index/video3d.mp4" type="video/mp4" />
  </video>

  <!-- Overlay semitransparente -->
  <div class="absolute inset-0 bg-black/60 pointer-events-none"></div>
</div>

  <!--  Botón de sonido -->
  <button id="btnAudio" 
    class="absolute bottom-6 right-6 bg-white/80 text-black px-4 py-2 rounded-lg shadow-md hover:bg-white transition z-20">
    🔊 Activar sonido
  </button>

  <!--  Encabezado -->
  <header class="flex flex-col justify-center items-center h-screen text-center px-6">
    <h1 class="text-6xl md:text-8xl mb-4 drop-shadow-lg">Giselle Ciardullo</h1>
    <h2 class="text-2xl md:text-3xl font-light tracking-wider drop-shadow-md">Artes Plásticas</h2>
  </header>

<!--  Navegación -->
<nav class="fixed top-0 left-0 w-full bg-black/40 backdrop-blur-sm shadow-md py-4 z-30 px-4 md:px-0">
  <div class="flex justify-between items-center">
    <div class="text-white font-bold text-xl">Menú</div>
    <!-- Botón hamburguesa -->
    <button id="hamburgerBtn" class="text-white md:hidden focus:outline-none">
      ☰
    </button>
  </div>

  <!-- Menú principal -->
  <ul id="menuItems" class="hidden flex-col md:flex md:flex-row md:justify-center gap-10 text-xl font-semibold text-white mt-4 md:mt-0">
    <li><a href="bio.html" class="hover:text-pink-300 transition block py-2 md:py-0">Bio</a></li>

    <li class="relative">
      <button id="tecnicasBtn" class="hover:text-pink-300 transition focus:outline-none block py-2 md:py-0">
        Técnicas ▾
      </button>
      <ul id="tecnicasMenu" class="hidden absolute bg-black/90 backdrop-blur-md py-3 px-4 rounded-lg shadow-lg text-base space-y-2 mt-2 w-40 md:mt-0 md:ml-0">
        <li><a href="sketch.html" class="block hover:text-pink-300 transition">Sketchbooks</a></li>
        <li><a href="novela.html" class="block hover:text-pink-300 transition">Novela Gráfica</a></li>
        <li><a href="comic.html" class="block hover:text-pink-300 transition">Comic</a></li>
        <li><a href="presas.html" class="block hover:text-pink-300 transition">Proyecto P</a></li>
      </ul>
    </li>

    <li><a href="contacto.html" class="hover:text-pink-300 transition block py-2 md:py-0">Contacto</a></li>
  </ul>
</nav>

  <!-- para manejar el audio y el problema de corte del video de fondo -->
  <script src="js/audioControl.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
